name: Update data

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Fetch headlines, gas and S&P
        run: python briefing.py
      - name: Save the new data
        run: |
          git config user.name "wall-display-bot"
          git config user.email "wall-display-bot@users.noreply.github.com"
          git add briefing.js briefing.json
          git diff --cached --quiet || (git commit -m "Update data" && git push)
